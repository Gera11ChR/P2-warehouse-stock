[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2-backend"
version = "0.1.0"
description = "Project P2 - Enterprise Fiber Optic Logistics & Fleet Inventory System (backend)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.41",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "pyotp>=2.9",
    "cryptography>=44",
    # ── Reportes corporativos XLSX (cambio 2026-10-01-reportes-consumo-management)
    # Versiones FIJADAS (dictamen @arq-reviewer, ajuste alto 8): el backend
    # inyecta datos sobre las plantillas corporativas con openpyxl (licencia
    # MIT) y NUNCA genera workbooks desde cero (REQ-P2-REP-001).
    "openpyxl==3.1.5",
    # Pillow (licencia MIT-CMU, variante SPDX de la histórica HPND del PIL
    # original; verificada en el METADATA del wheel) es REQUISITO para que
    # openpyxl CONSERVE la imagen embebida (company_logobrand.png) al guardar
    # el workbook: sin Pillow, openpyxl descarta silenciosamente las imágenes
    # (drawing1.xml no se reescribe) y las plantillas pierden el logo. Un test
    # del servicio de reportes FALLA si Pillow no está instalado.
    "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "critical: escenarios críticos de negocio (smoke para CI)",
]
