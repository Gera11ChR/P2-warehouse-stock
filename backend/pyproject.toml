[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2-backend"
version = "0.1.0"
description = "Project P2 - Enterprise Fiber Optic Logistics & Fleet Inventory System (backend)"
requires-python = ">=3.12"
authors = [{ name = "Gerardo Chávez Rodríguez" }]
license = { text = "Proprietary / All Rights Reserved (c) 2026 Gerardo Chávez Rodríguez" }
classifiers = ["License :: Other/Proprietary License"]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.41",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "pyotp>=2.9",
    "cryptography>=44",
    # ── Reportes corporativos XLSX (cambio 2026-10-01-reportes-consumo-management)
    # Versiones FIJADAS (dictamen @arq-reviewer, ajuste alto 8): el backend
    # inyecta datos sobre las plantillas corporativas con openpyxl (licencia
    # MIT) y NUNCA genera workbooks desde cero (REQ-P2-REP-001).
    "openpyxl==3.1.5",
    # Pillow es REQUISITO para que openpyxl CONSERVE la imagen embebida
    # (company_logobrand.png) al guardar el workbook: sin Pillow, openpyxl
    # descarta silenciosamente las imágenes (drawing1.xml no se reescribe) y
    # las plantillas pierden el logo. Un test del servicio de reportes FALLA
    # si Pillow no está instalado. Versión FIJADA a 13.0.0 (remediación
    # 2026-10-22, uv audit): 12.3.0 acumulaba 28 CVEs, todos corregidos en
    # 13.0.0; la aplicabilidad aquí sigue siendo baja (solo PNGs de
    # plantillas locales de confianza), pero la deuda CVE era evitable.
    "Pillow==13.0.0",
    # tzdata fijado (F-13): ZoneInfo debe funcionar sin depender de la tzdata
    # del sistema; la versión coincide con la entrada ya presente en uv.lock.
    "tzdata==2026.5",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
    "mypy>=1.11",
    # Stubs oficiales typeshed para openpyxl 3.1.5 (saneamiento mypy,
    # impacto runtime CERO). Versión FIJADA, consistente con la política
    # de pines del proyecto (cambio 2026-10-04-saneamiento-deuda-tecnica).
    "types-openpyxl==3.1.5.20260827",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "critical: escenarios críticos de negocio (smoke para CI)",
]
