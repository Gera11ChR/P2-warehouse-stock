[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2-backend"
version = "0.1.0"
description = "Project P2 - Enterprise Fiber Optic Logistics & Fleet Inventory System (backend)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.41",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "pyotp>=2.9",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]
