openspec: "1.0.0"
info:
  title: "DMS - TELECOM Inventory Specification"
  version: "1.0.0"
  description: "Contrato de arquitectura y API para la gestión de inventarios y transferencias de DMS - TELECOM."

domain_rules:
  immutable_id_lista:
    required: true
    description: "El id_lista es inmutable, permanente y nunca se re-numera."
  sparse_equipment_model:
    required: true
    description: "inventario_equipos solo contiene filas con existencias o movimientos reales."
  transaction_delegation:
    required: true
    mandatory_functions:
      - "fn_procesar_movimiento"
      - "fn_cancelar_movimiento"
      - "fn_cargar_stock_inicial"
      - "fn_ajustar_stock_almacen"
      - "fn_ajustar_stock_fibra"
      - "fn_eliminar_inventario_fibra"
      - "fn_crear_seguimiento"
      - "fn_cerrar_seguimiento"
      - "fn_sumar_cantidad"
      - "fn_mover_material"
      - "fn_agregar_todo_seguimiento"
    prohibition: "Cálculos matemáticos de stock prohibidos en Python/FastAPI."
  nomenclature_glossary:
    required: true
    description: "Glosario para evitar falsos positivos de drift tras el renombre DESPLIEGUE -> CONSUMO (renombre físico completo, sin alias legacy)."
    terms:
      CONSUMO: "Dominio funcional visible en UI y reportes (antes DESPLIEGUE)."
      seguimiento: "Entidad de API/BD (tablas seguimientos/seguimiento_items; antes despliegue). 'Crear Despliegue' pasa a 'Crear Seguimiento'."
      entrega: "Acta generada por la confirmación del flujo TEAMS (Acta de Entrega)."
  audit_ledger_immutability:
    required: true
    description: "auditoria_eventos es append-only. El renombre no actualiza filas históricas: los eventos DESPLIEGUE_CREADO/DESPLIEGUE_CERRADO históricos conservan su valor legacy; los nuevos eventos usan SEGUIMIENTO_CREADO/SEGUIMIENTO_CERRADO."
    events:
      - "SEGUIMIENTO_CREADO"
      - "SEGUIMIENTO_CERRADO"
      - "AGREGAR_TODO"
      - "SUMA_CANTIDAD"
      - "MOVIMIENTO_INVENTARIO"
      - "ACTA_ENTREGA_GENERADA"
      - "ACTA_CONSUMO_GENERADA"
  quick_operator_semantics:
    required: true
    description: "+Cantidad (SUMA_CANTIDAD) es una vía de mutación DISTINTA de los ajustes (AJUSTE_INVENTARIO / AJUSTE_INVENTARIO_FO, que fijan un nuevo stock con motivo obligatorio): suma una cantidad directa al stock existente. Mover (MOVIMIENTO_INVENTARIO) transfiere cantidad parcial entre Inventario General y módulos FO bajo el modelo disperso: la fila destino se crea solo con stock > 0 y la fila origen que llega a 0 se conserva."
  idempotency:
    required: true
    description: "fn_sumar_cantidad, fn_mover_material y fn_agregar_todo_seguimiento aceptan clave_idempotencia (tabla operaciones_idempotencia). Un reenvío con la misma clave responde 200 con el resultado original (reenvio_idempotente=true) sin duplicar efectos sobre stock ni auditoría."
  official_reports:
    required: true
    description: "Los reportes oficiales son XLSX inyectados sobre las plantillas corporativas (nunca generados desde cero) conservando estilo, celdas combinadas y logo. El CSV legacy queda descartado. Las actas son snapshots jsonb (actas_reportes) escritos por PostgreSQL en la transacción del evento."
    milestones:
      entrega: "Acta de Entrega: trigger tg_acta_entrega en la MISMA transacción SQL que confirma el movimiento TEAMS (estado transaccional real CONFIRMADO; COMPLETED no existe en el esquema)."
      consumo: "Acta de Consumo: registrada por fn_cerrar_seguimiento al cerrar el seguimiento (CANT. = cantidad consumida calculada en SQL)."
  classification_schema:
    legacy_removed: "TIPO"
    fields:
      - "categoria_id"
      - "nueva_categoria"

paths:
  /api/v1/movimientos/procesar:
    post:
      summary: "Ejecutar transferencia TEAMS o devolución DEVOL"
      operationId: "procesarMovimiento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - movimiento_id
              properties:
                movimiento_id:
                  type: integer
      responses:
        "200":
          description: "Movimiento procesado exitosamente vía fn_procesar_movimiento (estado CONFIRMADO). Si es TEAMS, el trigger tg_acta_entrega registra el Acta de Entrega con snapshot jsonb en la misma transacción (evento ACTA_ENTREGA_GENERADA)"
        "400":
          description: "Stock insuficiente o movimiento en estado no válido"
  /api/v1/movimientos/{movimiento_id}/cancelar:
    post:
      summary: "Cancelar y revertir un movimiento CONFIRMADO"
      operationId: "cancelarMovimiento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
      responses:
        "200":
          description: "Movimiento revertido vía fn_cancelar_movimiento"
        "400":
          description: "Stock insuficiente para revertir"
        "409":
          description: "Movimiento en estado no cancelable"
  /api/v1/ajustes/carga-inicial:
    post:
      summary: "Carga inicial de inventario (alta de material)"
      operationId: "cargarStockInicial"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - almacen_id
                - material_id
                - cantidad
              properties:
                almacen_id:
                  type: integer
                material_id:
                  type: integer
                cantidad:
                  type: integer
                motivo:
                  type: string
      responses:
        "200":
          description: "Inventario inicial registrado vía fn_cargar_stock_inicial"
        "400":
          description: "Cantidad negativa o registro de inventario ya existente"
  /api/v1/ajustes/stock-almacen:
    post:
      summary: "Ajuste administrativo de existencias (conciliación)"
      operationId: "ajustarStockAlmacen"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - almacen_id
                - material_id
                - nuevo_stock
                - motivo
              properties:
                almacen_id:
                  type: integer
                material_id:
                  type: integer
                nuevo_stock:
                  type: integer
                motivo:
                  type: string
      responses:
        "200":
          description: "Stock ajustado vía fn_ajustar_stock_almacen"
        "400":
          description: "Stock final negativo o motivo vacío"
        "404":
          description: "Sin registro de inventario previo (requiere carga inicial)"
  /api/v1/catalogo/categorias/{categoria_id}:
    put:
      summary: "Modificar una categoría existente"
      operationId: "modificarCategoria"
      responses:
        "200":
          description: "Categoría modificada (evento CATEGORIA_MODIFICADA)"
        "409":
          description: "Nombre de categoría duplicado"
    delete:
      summary: "Eliminar (soft-delete) una categoría"
      operationId: "eliminarCategoria"
      responses:
        "204":
          description: "Categoría desactivada (is_active=false, evento CATEGORIA_ELIMINADA)"
  /api/v1/catalogo/um/{um_id}:
    put:
      summary: "Modificar una unidad de medida existente"
      operationId: "modificarUM"
      responses:
        "200":
          description: "U.M. modificada (evento UM_MODIFICADA)"
        "409":
          description: "Nombre de U.M. duplicado"
    delete:
      summary: "Eliminar (soft-delete) una unidad de medida"
      operationId: "eliminarUM"
      responses:
        "204":
          description: "U.M. desactivada (is_active=false, evento UM_ELIMINADA)"
  /api/v1/equipos/{equipo_id}/inventario/{material_id}:
    patch:
      summary: "Configurar parámetros locales de inventario de equipo"
      operationId: "configurarInventarioEquipo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stock_minimo_local:
                  type: integer
                categoria_local_id:
                  type: integer
                um_local_id:
                  type: integer
      responses:
        "200":
          description: "Configuración local actualizada (evento CONFIG_EQUIPO_MODIFICADA)"
        "422":
          description: "Campos no permitidos (stock_actual, codigo, descripcion) o valores inválidos"
  /api/v1/equipos/{equipo_id}/seguimientos:
    post:
      summary: "Crear seguimiento de CONSUMO para un equipo ('Crear Seguimiento'; antes 'Crear Despliegue')"
      operationId: "crearSeguimiento"
      responses:
        "201":
          description: "Seguimiento creado en estado ABIERTA vía fn_crear_seguimiento (evento SEGUIMIENTO_CREADO)"
        "409":
          description: "El equipo ya posee un seguimiento abierto"
    get:
      summary: "Listar seguimientos de CONSUMO de un equipo"
      operationId: "listarSeguimientosEquipo"
      responses:
        "200":
          description: "Lista de seguimientos del equipo"
  /api/v1/equipos/{equipo_id}/seguimientos/{seguimiento_id}:
    get:
      summary: "Obtener un seguimiento del equipo (verifica pertenencia)"
      operationId: "obtenerSeguimiento"
      responses:
        "200":
          description: "Seguimiento del equipo"
        "404":
          description: "Seguimiento no encontrado o no pertenece al equipo"
  /api/v1/equipos/{equipo_id}/seguimientos/{seguimiento_id}/agregar-todo:
    post:
      summary: "'Agregar todo': cargar al seguimiento todo el inventario del equipo con existencias"
      operationId: "agregarTodoSeguimiento"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clave_idempotencia:
                  type: string
      responses:
        "200":
          description: "Líneas agregadas vía fn_agregar_todo_seguimiento (atómica e idempotente: una segunda invocación no duplica líneas; evento AGREGAR_TODO solo si hubo líneas nuevas). Un reenvío con la misma clave devuelve el resultado original"
        "404":
          description: "Seguimiento no encontrado o no pertenece al equipo"
        "409":
          description: "El seguimiento no se encuentra en estado ABIERTA"
  /api/v1/equipos/{equipo_id}/seguimientos/{seguimiento_id}/cerrar:
    post:
      summary: "Cerrar seguimiento registrando sobrantes, ajustando stock del equipo y registrando el Acta de Consumo"
      operationId: "cerrarSeguimiento"
      responses:
        "200":
          description: "Seguimiento cerrado vía fn_cerrar_seguimiento (auditoría SEGUIMIENTO_CERRADO por línea y Acta de Consumo ACTA_CONSUMO_GENERADA con snapshot jsonb en la misma transacción)"
        "400":
          description: "Sobrante mayor a tomada, negativo o stock de equipo insuficiente"
        "404":
          description: "Seguimiento no encontrado"
        "409":
          description: "Seguimiento no se encuentra en estado ABIERTA (doble cierre)"
  /api/v1/inventario/secciones/transferibles:
    get:
      summary: "Secciones válidas como origen/destino de transferencias (GENERAL activas + manejadores FO)"
      operationId: "seccionesTransferibles"
      responses:
        "200":
          description: "Lista de secciones transferibles"
  /api/v1/inventario/sumar-cantidad:
    post:
      summary: "+Cantidad: sumar una cantidad directa al stock existente (Inventario General o módulos FO)"
      operationId: "sumarCantidad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destino
                - material_id
                - cantidad
              properties:
                destino:
                  type: string
                  enum: [GENERAL, FO]
                modulo:
                  type: string
                  enum: [PAQUETE, EN_USO]
                  description: "Obligatorio cuando destino = FO"
                material_id:
                  type: integer
                cantidad:
                  type: integer
                clave_idempotencia:
                  type: string
      responses:
        "200":
          description: "Stock incrementado vía fn_sumar_cantidad (evento inmutable SUMA_CANTIDAD, distinto de AJUSTE_*). Reenvío con la misma clave: resultado original con reenvio_idempotente=true"
        "400":
          description: "Cantidad menor o igual a cero"
        "403":
          description: "Actor sin alcance"
        "404":
          description: "Material inexistente/inactivo o sin registro de inventario previo (requiere carga inicial)"
        "409":
          description: "Más de una sección GENERAL activa con el material (destino no determinable)"
        "422":
          description: "Payload inválido (módulo FO ausente o no aplicable)"
  /api/v1/inventario/mover:
    post:
      summary: "Mover: transferencia directa de cantidad parcial entre Inventario General y módulos FO"
      operationId: "moverMaterial"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - origen
                - destino
                - material_id
                - cantidad
              properties:
                origen:
                  type: string
                  enum: [GENERAL, FO]
                origen_modulo:
                  type: string
                  enum: [PAQUETE, EN_USO]
                destino:
                  type: string
                  enum: [GENERAL, FO]
                destino_modulo:
                  type: string
                  enum: [PAQUETE, EN_USO]
                material_id:
                  type: integer
                cantidad:
                  type: integer
                clave_idempotencia:
                  type: string
      responses:
        "200":
          description: "Material movido vía fn_mover_material (evento inmutable MOVIMIENTO_INVENTARIO; fila destino creada solo con stock > 0; fila origen en 0 conservada). Reenvío con la misma clave: resultado original con reenvio_idempotente=true"
        "400":
          description: "Cantidad menor o igual a cero o stock insuficiente en el origen (ningún inventario queda modificado)"
        "403":
          description: "Actor sin alcance"
        "404":
          description: "Material inexistente/inactivo o sin registro de inventario en el origen"
        "409":
          description: "Más de una sección GENERAL activa o ninguna activa (destino/origen no determinable)"
        "422":
          description: "Destino igual al origen o payload inválido (módulo FO ausente o no aplicable)"
  /api/v1/reportes/entrega:
    get:
      summary: "Acta(s) de Entrega (hito A: generadas al confirmar TEAMS) en JSON o XLSX sobre la plantilla corporativa"
      operationId: "reporteEntrega"
      parameters:
        - name: equipo_id
          in: query
          required: false
          schema:
            type: integer
        - name: desde
          in: query
          required: false
          schema:
            type: string
        - name: hasta
          in: query
          required: false
          schema:
            type: string
        - name: acta_id
          in: query
          required: false
          schema:
            type: integer
        - name: formato
          in: query
          required: false
          description: "json (listado, por defecto) | normal (plantilla '1 ACTA DE REPORTE NORMAL.xlsx') | extenso (plantilla '2 ACTA DE REPORTE EXTENSO.xlsx'). El CSV legacy queda descartado"
          schema:
            type: string
            enum: [json, normal, extenso]
      responses:
        "200":
          description: "json: listado de actas (snapshot jsonb). normal|extenso: adjunto application/vnd.openxmlformats-officedocument.spreadsheetml.sheet generado inyectando datos con OpenPyXL en la plantilla corporativa (estilo, celdas combinadas y logo conservados)"
        "403":
          description: "equipo_id al que el actor no pertenece"
        "404":
          description: "Formato XLSX solicitado sin actas para los filtros indicados"
        "422":
          description: "Formato no soportado (p. ej. csv)"
  /api/v1/reportes/consumo:
    get:
      summary: "Acta(s) de Consumo (hito B: generadas al cerrar el seguimiento) en JSON o XLSX sobre la plantilla corporativa"
      operationId: "reporteConsumo"
      parameters:
        - name: equipo_id
          in: query
          required: false
          schema:
            type: integer
        - name: desde
          in: query
          required: false
          schema:
            type: string
        - name: hasta
          in: query
          required: false
          schema:
            type: string
        - name: acta_id
          in: query
          required: false
          schema:
            type: integer
        - name: formato
          in: query
          required: false
          description: "json (listado, por defecto) | normal | extenso. En XLSX el título es 'ACTA DE CONSUMO' y CANT. es la cantidad consumida (calculada en SQL); las líneas sin consumo se omiten. El CSV legacy queda descartado"
          schema:
            type: string
            enum: [json, normal, extenso]
      responses:
        "200":
          description: "json: listado de actas (snapshot jsonb). normal|extenso: adjunto XLSX sobre la plantilla corporativa"
        "403":
          description: "equipo_id al que el actor no pertenece"
        "404":
          description: "Formato XLSX solicitado sin actas para los filtros indicados"
        "422":
          description: "Formato no soportado (p. ej. csv)"
  /api/v1/fibra/{modulo}/materiales/{material_id}:
    patch:
      summary: "Modificar material del inventario FO (catálogo + stock ajustado y auditado)"
      operationId: "actualizarMaterialFibra"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                descripcion:
                  type: string
                codigo:
                  type: string
                categoria_id:
                  type: integer
                nueva_categoria:
                  type: string
                u_m:
                  type: string
                stock_minimo:
                  type: integer
                stock_actual:
                  type: integer
                motivo:
                  type: string
      responses:
        "200":
          description: "Material FO actualizado: edición de catálogo auditada (trigger) y ajuste AJUSTE_INVENTARIO_FO vía fn_ajustar_stock_fibra en una única transacción atómica"
        "404":
          description: "Material no encontrado (catálogo inexistente/inactivo) o sin fila en el módulo FO"
        "422":
          description: "U.M. inexistente en el maestro ums, selector dual de categoría inválido o stock_actual sin motivo no vacío"
    delete:
      summary: "Eliminar fila de inventario FO del módulo (auditada ELIMINACION_FO)"
      operationId: "eliminarMaterialFibra"
      parameters:
        - name: motivo
          in: query
          required: false
          schema:
            type: string
      responses:
        "204":
          description: "Fila de inventario FO eliminada vía fn_eliminar_inventario_fibra (evento ELIMINACION_FO con snapshot completo jsonb)"
        "404":
          description: "Material inexistente/inactivo en el catálogo o sin fila en el módulo FO"
        "422":
          description: "Motivo vacío con stock_actual > 0 (REQ-DEL-004)"