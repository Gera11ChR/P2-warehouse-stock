openspec: "1.0.0"
info:
  title: "DMS - TELECOM Inventory Specification"
  version: "1.0.0"
  description: "Contrato de arquitectura y API para la gestión de inventarios y transferencias de DMS - TELECOM."

domain_rules:
  immutable_id_lista:
    required: true
    description: "El id_lista es inmutable, permanente y nunca se re-numera."
  sparse_equipment_model:
    required: true
    description: "inventario_equipos solo contiene filas con existencias o movimientos reales."
  transaction_delegation:
    required: true
    mandatory_functions:
      - "fn_procesar_movimiento"
      - "fn_cancelar_movimiento"
      - "fn_cargar_stock_inicial"
      - "fn_cargar_stock_inicial_fibra"
      - "fn_ajustar_stock_almacen"
      - "fn_ajustar_stock_general"
      - "fn_ajustar_stock_fibra"
      - "fn_eliminar_inventario_fibra"
      - "fn_crear_seguimiento"
      - "fn_cerrar_seguimiento"
      - "fn_sumar_cantidad"
      - "fn_mover_material"
      - "fn_agregar_todo_seguimiento"
    read_only_calculation_functions:
      - "fn_valor_total_inventario"
    prohibition: "Cálculos matemáticos de stock Y de valor (Valor Total = Σ Stock Actual × Valor Unitario) prohibidos en Python/FastAPI y en React: el cálculo vive en PostgreSQL (fn_valor_total_inventario, solo lectura, aritmética NUMERIC exacta con redondeo a 3 decimales al final)."
  nomenclature_glossary:
    required: true
    description: "Glosario para evitar falsos positivos de drift tras el renombre DESPLIEGUE -> CONSUMO (renombre físico completo, sin alias legacy)."
    terms:
      CONSUMO: "Dominio funcional visible en UI y reportes (antes DESPLIEGUE)."
      seguimiento: "Entidad de API/BD (tablas seguimientos/seguimiento_items; antes despliegue). 'Crear Despliegue' pasa a 'Crear Seguimiento'."
      entrega: "Acta generada por la confirmación del flujo TEAMS (Acta de Entrega)."
      "Inventario FO": "Locación ÚNICA de fibra óptica (antes FO Paquete / FO En Uso): inventario_fibra con una fila por material, sin módulos; sección de ruteo secciones.tipo='FO'."
      "Valor Unitario": "Atributo de catalogo_materiales (MXN, NUMERIC(12,3), default 1.000) compartido por Inventario General, Inventario FO e Inventario por Unidad."
      "Valor Total": "Σ Stock Actual × Valor Unitario de General activo + Inventario FO; GET /inventario/resumen-general."
      historical_technical_values: "TEAMS y DEVOL son valores técnicos (tipos de movimiento) exentos: jamás se renombran. FO_PAQUETE/FO_EN_USO ya NO existen (purgados por 0028, 2026-10-purga-legacy-fo)."
  audit_ledger_immutability:
    required: true
    description: "auditoria_eventos y actas_reportes son append-only (triggers tg_ledger_*_inmutable). ÚNICA dispensa registrada: enmienda acotada E-1 (paquete 2026-10-purga-legacy-fo), a través de una única revisión (0028) y solo sobre p2/p2_test (texto en openspec/changes/archive/2026-10-purga-legacy-fo/spec.md §3.1) (borrado físico de datos de prueba dependientes de FO_PAQUETE/FO_EN_USO; triggers reactivados y verificados; rastro en el evento PURGA_LEGACY_FO); no autoriza purgas futuras ni modifica docs/constitution.md. El renombre no actualiza filas históricas: los eventos DESPLIEGUE_CREADO/DESPLIEGUE_CERRADO históricos conservan su valor legacy; los nuevos eventos usan SEGUIMIENTO_CREADO/SEGUIMIENTO_CERRADO."
    events:
      - "SEGUIMIENTO_CREADO"
      - "SEGUIMIENTO_CERRADO"
      - "AGREGAR_TODO"
      - "SUMA_CANTIDAD"
      - "MOVIMIENTO_INVENTARIO"
      - "ACTA_ENTREGA_GENERADA"
      - "ACTA_CONSUMO_GENERADA"
      - "MATERIAL_MODIFICADO"
      - "PURGA_LEGACY_FO"
    attribution: "Los eventos emitidos por triggers de catálogo toman el actor de `app.actor` (COALESCE(NULLIF(current_setting('app.actor', true), ''), CURRENT_USER)); el servicio DEBE fijar `app.actor` ANTES de mutar el ORM (el autoflush de session.execute emitiría el UPDATE antes del set_config). Eventos históricos con usuario = rol de BD no se reescriben (append-only)."
    type_widening_precedent: "0027 ensancha auditoria_eventos.cantidad a NUMERIC(12,3) con USING cast sin modificar valores ni disparar triggers de fila (no es una mutación del ledger)."
    historical_events: "MATERIAL_MODIFICADO (audita también valor_unitario anterior/nuevo). Los eventos FO_UNIFICADO y los que llevaban `modulo` PAQUETE/EN_USO fueron purgados por 0028 (E-1); PURGA_LEGACY_FO es el rastro de esa purga."
  fo_unificado:
    required: true
    description: "El Inventario FO es único: inventario_fibra con PK material_id (sin `modulo`); toda operación FO (carga inicial, ajuste, PATCH/DELETE de material, +Cantidad, Mover, TRANSF) se enruta por la sección tipo 'FO'. Enviar `modulo`/`origen_modulo`/`destino_modulo` es HTTP 422 (extra=forbid). Las secciones FO_PAQUETE/FO_EN_USO no existen (purgadas por 0028): secciones.tipo ∈ {GENERAL, FO} (ck_secciones_tipo) y un almacen_id inexistente responde 422 «Sección origen/destino inexistente»."
  valor_unitario:
    required: true
    description: "valor_unitario es un atributo AUDITADO de catalogo_materiales (MXN, NUMERIC(12,3) >= 0, default 1.000). Solo un administrador puede enviarlo (403 por PRESENCIA del campo en PATCH /catalogo/{id} y PATCH /fibra/materiales/{id}, evaluado antes del passthrough); `null` explícito es no-op sin evento ni 500; MaterialCreate no lo acepta (nace en 1.000). Cada cambio emite un evento MATERIAL_MODIFICADO inmutable con valores anterior y nuevo. Valor Total global (General activo + Inventario FO, no reacciona al filtro de sección); sin multimoneda, histórico de precios ni costeo."
  decimal_quantities:
    required: true
    description: "Existencias, cantidades de movimiento, cantidades tomadas/consumidas, parámetros de operaciones transaccionales y auditoria_eventos.cantidad son NUMERIC(12,3) (hasta 3 decimales y 12 dígitos; máximo 999999999.999). Entradas con >3 decimales, NaN/Infinity o notación científica sobre-precisa son 422 sin redondeo silencioso; desbordamiento SQLSTATE 22003 es 400 canónico; nunca 500. Salidas como números JSON. Identificadores y stock_minimo permanecen enteros. Las funciones PL/pgSQL validan la escala como defensa en profundidad ('La cantidad admite máximo 3 decimales.')."
  actor_header:
    required: true
    description: "X-Actor es un identificador NO autenticado (desviación conocida de la Constitución §3.1/§3.3, reconocida por el humano; la autenticación real, tokens y rol del actor en el contrato están fuera de alcance). Se valida su forma antes de consultar la base de datos: 1..100 caracteres, al menos un carácter no blanco y sin caracteres de control (C0, DEL y C1); si no, HTTP 422."
  numeric_out_of_range:
    required: true
    description: "Un identificador o valor entero fuera del rango de su columna que PostgreSQL rechaza (SQLSTATE 22003) responde HTTP 400 con el cuerpo de error canónico (code NUMERIC_OUT_OF_RANGE, mensaje fijo sin detalles de la base), nunca 500. Handler global exclusivo por SQLSTATE 22003; el resto de errores de base de datos conserva su tratamiento."
  audit_result_convention:
    required: true
    description: "auditoria_eventos.resultado emitido por el código vivo y por las stored functions vigentes es siempre 'EXITO' (guardián: backend/tests/test_convencion_resultado.py). El 'OK' histórico de la migración 0027 (FO_UNIFICADO) está exento: no se edita 0027 ni se reescriben eventos."
  quick_operator_semantics:
    required: true
    description: "+Cantidad (SUMA_CANTIDAD) es una vía de mutación DISTINTA de los ajustes (AJUSTE_INVENTARIO / AJUSTE_INVENTARIO_FO, que fijan un nuevo stock con motivo obligatorio): suma una cantidad directa al stock existente. Mover (MOVIMIENTO_INVENTARIO) transfiere cantidad parcial entre Inventario General e Inventario FO (único, sin módulos) bajo el modelo disperso: la fila destino se crea solo con stock > 0 y la fila origen que llega a 0 se conserva."
  idempotency:
    required: true
    description: "fn_sumar_cantidad, fn_mover_material y fn_agregar_todo_seguimiento aceptan clave_idempotencia (tabla operaciones_idempotencia, ligada al ACTOR desde la migración 0021). Un reenvío del MISMO actor con la misma clave responde 200 con el resultado original (reenvio_idempotente=true) sin duplicar efectos sobre stock ni auditoría; la clave de OTRO actor se rechaza con 409 sin divulgar el resultado original. La clave de idempotencia nunca se persiste en auditoria_eventos."
  justificacion_opcional:
    required: true
    description: "Ergonomía 2026-10-04: el campo de justificación (motivo/observaciones) es OPCIONAL en la modificación de materiales, los ajustes administrativos de stock (POST /ajustes/stock-almacen y POST /fibra/ajuste), los borradores TEAMS/DEVOL y la cancelación de movimientos. Se acepta null, cadena vacía o campo omitido; el ledger inmutable sigue auditando cada mutación con el motivo tal como llega (NULL permitido). Excepción: la eliminación FO con stock > 0 conserva motivo obligatorio (REQ-DEL-004)."
  transferencias_multi_origen:
    required: true
    description: "2026-10-12: un borrador TEAMS (TRANSF) puede combinar líneas de Inventario General y de Inventario FO. Cada línea del detalle lleva su `origen_almacen_id` (opcional: si se omite hereda el de la cabecera, payload legado válido). movimientos_cabecera.origen_almacen_id es el origen común o NULL si el carrito es mixto. fn_procesar_movimiento y fn_cancelar_movimiento validan y mueven el stock POR LÍNEA contra su origen (inventario_almacen o inventario_fibra, único por material) en una sola transacción, con bloqueos FOR UPDATE en orden (origen, material). Se emite UNA sola acta de entrega (folio único) con el origen de cada línea. DEVOL no admite origen por línea. El actor no administrador requiere scope sobre TODOS los orígenes (403 si falta alguno)."
  official_reports:
    required: true
    description: "Los reportes oficiales son XLSX inyectados sobre las plantillas corporativas (nunca generados desde cero) conservando estilo, celdas combinadas y logo. El CSV legacy queda descartado. Las actas son snapshots jsonb (actas_reportes) escritos por PostgreSQL en la transacción del evento."
    milestones:
      entrega: "Acta de Entrega: trigger tg_acta_entrega en la MISMA transacción SQL que confirma el movimiento TEAMS (estado transaccional real CONFIRMADO; COMPLETED no existe en el esquema)."
      consumo: "Acta de Consumo: registrada por fn_cerrar_seguimiento al cerrar el seguimiento (CANT. = cantidad consumida calculada en SQL)."
  classification_schema:
    legacy_removed: "TIPO"
    fields:
      - "categoria_id"
      - "nueva_categoria"

paths:
  /api/v1/movimientos:
    post:
      summary: "Crear borrador TEAMS (origen por línea, multi-origen) o DEVOL"
      operationId: "crearBorradorMovimiento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tipo_movimiento, detalle]
              properties:
                tipo_movimiento:
                  type: string
                  enum: [TEAMS, DEVOL]
                origen_almacen_id:
                  type: [integer, "null"]
                  description: "TEAMS: origen por defecto de las líneas sin origen propio. La cabecera persistida guarda el origen común o NULL si es mixto."
                destino_equipo_id:
                  type: [integer, "null"]
                origen_equipo_id:
                  type: [integer, "null"]
                destino_almacen_id:
                  type: [integer, "null"]
                observaciones:
                  type: [string, "null"]
                detalle:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [material_id, cantidad]
                    properties:
                      material_id:
                        type: integer
                      cantidad:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 999999999.999
                        description: "Decimal > 0, hasta 3 decimales (escala NUMERIC(12,3), máximo 999999999.999). Sobre-precisión (más de 3 decimales) o valor fuera de rango → 422; nunca se redondea en silencio"
                      origen_almacen_id:
                        type: [integer, "null"]
                        description: "TEAMS: sección de origen de la línea (General o FO). Prohibido en DEVOL."
      responses:
        "201":
          description: "Borrador creado; cada línea devuelve su origen_almacen_id"
        "403":
          description: "Actor sin scope sobre alguna de las secciones de origen (o sin acceso a la unidad)"
        "422":
          description: "Línea sin origen, sección inexistente o GENERAL inactiva, origen por línea en DEVOL, cantidad con escala/rango decimal inválido (más de 3 decimales, <= 0 o > 999999999.999) o payload inválido"
  /api/v1/movimientos/procesar:
    post:
      summary: "Ejecutar transferencia TEAMS o devolución DEVOL"
      operationId: "procesarMovimiento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - movimiento_id
              properties:
                movimiento_id:
                  type: integer
      responses:
        "200":
          description: "Movimiento procesado exitosamente vía fn_procesar_movimiento (estado CONFIRMADO; en un borrador TEAMS mixto cada línea se descuenta de SU origen en una sola transacción). Si es TEAMS, el trigger tg_acta_entrega registra el Acta de Entrega con snapshot jsonb en la misma transacción (evento ACTA_ENTREGA_GENERADA)"
        "400":
          description: "Stock insuficiente en el origen de alguna línea (rollback total), desbordamiento numérico NUMERIC(12,3) (SQLSTATE 22003) o movimiento en estado no válido"
  /api/v1/movimientos/{movimiento_id}/cancelar:
    post:
      summary: "Cancelar y revertir un movimiento CONFIRMADO"
      operationId: "cancelarMovimiento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo:
                  type: string
      responses:
        "200":
          description: "Movimiento revertido vía fn_cancelar_movimiento"
        "400":
          description: "Stock insuficiente para revertir"
        "409":
          description: "Movimiento en estado no cancelable"
  /api/v1/ajustes/carga-inicial:
    post:
      summary: "Carga inicial de inventario (alta de material)"
      operationId: "cargarStockInicial"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - almacen_id
                - material_id
                - cantidad
              properties:
                almacen_id:
                  type: integer
                material_id:
                  type: integer
                cantidad:
                  type: number
                  minimum: 0
                  maximum: 999999999.999
                  description: "Decimal >= 0, hasta 3 decimales (escala/rango decimal NUMERIC(12,3))"
                motivo:
                  type: string
      responses:
        "200":
          description: "Inventario inicial registrado vía fn_cargar_stock_inicial"
        "400":
          description: "Cantidad negativa, registro de inventario ya existente o desbordamiento numérico (SQLSTATE 22003)"
        "422":
          description: "Cantidad con más de 3 decimales o fuera del rango decimal NUMERIC(12,3), o payload inválido"
  /api/v1/ajustes/stock-almacen:
    post:
      summary: "Ajuste administrativo de existencias (conciliación)"
      operationId: "ajustarStockAlmacen"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - almacen_id
                - material_id
                - nuevo_stock
              properties:
                almacen_id:
                  type: integer
                material_id:
                  type: integer
                nuevo_stock:
                  type: number
                  minimum: 0
                  maximum: 999999999.999
                  description: "Decimal >= 0, hasta 3 decimales (escala/rango decimal NUMERIC(12,3))"
                motivo:
                  type: string
                  description: "Opcional (ergonomía justificacion_opcional): se acepta null, cadena vacía o campo omitido"
      responses:
        "200":
          description: "Stock ajustado vía fn_ajustar_stock_almacen"
        "400":
          description: "Stock final negativo o desbordamiento numérico (SQLSTATE 22003)"
        "404":
          description: "Sin registro de inventario previo (requiere carga inicial)"
        "422":
          description: "nuevo_stock con más de 3 decimales o fuera del rango decimal NUMERIC(12,3), o payload inválido"
  /api/v1/catalogo:
    get:
      summary: "Listar el catálogo activo de materiales (incluye valor_unitario)"
      operationId: "listarMateriales"
      responses:
        "200":
          description: "Catálogo activo con rango ordinal opcional (start_index); cada material expone su valor_unitario en MXN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialListOut"
        "422":
          description: "Filtros o rangos inválidos"
    post:
      summary: "Crear material del catálogo (con stock_inicial decimal opcional)"
      operationId: "crearMaterial"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialCreate"
      responses:
        "201":
          description: "Material creado; valor_unitario inicial 1.000 MXN (el alta no acepta valor_unitario)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialOut"
        "422":
          description: "Payload inválido (extra forbid: valor_unitario no se acepta en el alta; stock_inicial con más de 3 decimales o fuera de rango)"
  /api/v1/catalogo/{id_lista}:
    patch:
      summary: "Modificar un material del catálogo (alcance Inventario General); valor_unitario solo administrador"
      operationId: "actualizarMaterial"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUpdate"
      responses:
        "200":
          description: "Material actualizado (la edición de valor_unitario queda auditada por trigger; stock_actual, si se envía, se ajusta vía fn_ajustar_stock_general en la misma transacción). `valor_unitario: null` explícito es un no-op: no escribe ni audita"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialOut"
        "403":
          description: "La presencia de `valor_unitario` en el payload exige rol administrador (AUTHORIZATION_FAILED); se evalúa antes de cualquier escritura"
        "404":
          description: "Material no encontrado"
        "422":
          description: "Campo no permitido (extra forbid), valor_unitario/stock_actual negativo, con más de 3 decimales o fuera del rango NUMERIC(12,3)"
  /api/v1/catalogo/categorias/{categoria_id}:
    put:
      summary: "Modificar una categoría existente"
      operationId: "modificarCategoria"
      responses:
        "200":
          description: "Categoría modificada (evento CATEGORIA_MODIFICADA)"
        "409":
          description: "Nombre de categoría duplicado"
    delete:
      summary: "Eliminar (soft-delete) una categoría"
      operationId: "eliminarCategoria"
      responses:
        "204":
          description: "Categoría desactivada (is_active=false, evento CATEGORIA_ELIMINADA)"
  /api/v1/catalogo/um/{um_id}:
    put:
      summary: "Modificar una unidad de medida existente"
      operationId: "modificarUM"
      responses:
        "200":
          description: "U.M. modificada (evento UM_MODIFICADA)"
        "409":
          description: "Nombre de U.M. duplicado"
    delete:
      summary: "Eliminar (soft-delete) una unidad de medida"
      operationId: "eliminarUM"
      responses:
        "204":
          description: "U.M. desactivada (is_active=false, evento UM_ELIMINADA)"
  /api/v1/equipos/{equipo_id}:
    patch:
      summary: "Modificar un equipo (nombre, descripción, integrantes, actividad)"
      operationId: "actualizarEquipo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                integrantes:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                  description: "Lista COMPLETA de integrantes (reemplaza la anterior, sin duplicados)"
                is_active:
                  type: boolean
      responses:
        "200":
          description: "Equipo actualizado (sincronización atómica de integrantes: los previos se eliminan y se insertan los nuevos en la misma transacción)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  equipo_id:
                    type: integer
                  nombre:
                    type: string
                  descripcion:
                    type: [string, "null"]
                  is_active:
                    type: boolean
                  integrantes:
                    type: array
                    items:
                      type: string
        "403":
          description: "Actor sin acceso: solo el administrador o un integrante actual del equipo puede modificarlo"
        "404":
          description: "Equipo no encontrado o inactivo"
        "422":
          description: "Payload inválido (integrantes duplicados, más de 50, nombre vacío)"
  /api/v1/equipos/{equipo_id}/inventario:
    get:
      summary: "Inventario autónomo del equipo (stock decimal y valor_unitario)"
      operationId: "inventarioEquipo"
      responses:
        "200":
          description: "Filas físicas con stock del equipo (materiales activos, stock > 0); un equipo nuevo devuelve []. stock_actual decimal y valor_unitario por JOIN al catálogo maestro; stock_minimo y los identificadores permanecen enteros"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventarioEquipoOut"
        "422":
          description: "equipo_id inválido"
  /api/v1/equipos/{equipo_id}/inventario/{material_id}:
    patch:
      summary: "Configurar parámetros locales de inventario de equipo"
      operationId: "configurarInventarioEquipo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stock_minimo_local:
                  type: integer
                categoria_local_id:
                  type: integer
                um_local_id:
                  type: integer
      responses:
        "200":
          description: "Configuración local actualizada (evento CONFIG_EQUIPO_MODIFICADA)"
        "422":
          description: "Campos no permitidos (stock_actual, codigo, descripcion) o valores inválidos"
  /api/v1/equipos/{equipo_id}/seguimientos:
    post:
      summary: "Crear seguimiento de CONSUMO para un equipo ('Crear Seguimiento'; antes 'Crear Despliegue')"
      operationId: "crearSeguimiento"
      responses:
        "201":
          description: "Seguimiento creado en estado ABIERTA vía fn_crear_seguimiento (evento SEGUIMIENTO_CREADO)"
        "409":
          description: "El equipo ya posee un seguimiento abierto"
    get:
      summary: "Listar seguimientos de CONSUMO de un equipo"
      operationId: "listarSeguimientosEquipo"
      responses:
        "200":
          description: "Lista de seguimientos del equipo"
  /api/v1/equipos/{equipo_id}/seguimientos/{seguimiento_id}:
    get:
      summary: "Obtener un seguimiento del equipo (verifica pertenencia)"
      operationId: "obtenerSeguimiento"
      responses:
        "200":
          description: "Seguimiento del equipo"
        "404":
          description: "Seguimiento no encontrado o no pertenece al equipo"
  /api/v1/equipos/{equipo_id}/seguimientos/{seguimiento_id}/agregar-todo:
    post:
      summary: "'Agregar todo': cargar al seguimiento todo el inventario del equipo con existencias"
      operationId: "agregarTodoSeguimiento"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clave_idempotencia:
                  type: string
      responses:
        "200":
          description: "Líneas agregadas vía fn_agregar_todo_seguimiento (atómica e idempotente: una segunda invocación no duplica líneas; evento AGREGAR_TODO solo si hubo líneas nuevas). Un reenvío con la misma clave devuelve el resultado original"
          content:
            application/json:
              schema:
                type: object
                required: [lineas_agregadas, seguimiento]
                properties:
                  lineas_agregadas:
                    type: integer
                    description: "Cantidad de líneas nuevas calculada por la función SQL"
                  seguimiento:
                    type: object
                    required: [id, equipo_id, fecha, usuario, estado, created_at, updated_at, items]
                    properties:
                      id:
                        type: integer
                      equipo_id:
                        type: integer
                      fecha:
                        type: string
                      observaciones:
                        type: [string, "null"]
                      usuario:
                        type: string
                      estado:
                        type: string
                        enum: [ABIERTA, CERRADA]
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      closed_at:
                        type: [string, "null"]
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            material_id:
                              type: integer
                            cantidad_tomada:
                              type: number
                              description: "Decimal (NUMERIC(12,3))"
                            cantidad_consumida:
                              type: [number, "null"]
                              description: "Decimal (NUMERIC(12,3)); null mientras el seguimiento está ABIERTA"
        "404":
          description: "Seguimiento no encontrado o no pertenece al equipo"
        "409":
          description: "El seguimiento no se encuentra en estado ABIERTA"
  /api/v1/equipos/{equipo_id}/seguimientos/{seguimiento_id}/cerrar:
    post:
      summary: "Cerrar seguimiento registrando lo CONSUMIDO (una línea por material), descontándolo del stock de la unidad y registrando el Acta de Consumo"
      operationId: "cerrarSeguimiento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consumidos]
              properties:
                consumidos:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [material_id, cantidad_consumida]
                    properties:
                      material_id:
                        type: integer
                        exclusiveMinimum: 0
                      cantidad_consumida:
                        type: number
                        minimum: 0
                        maximum: 999999999.999
                        description: "Decimal >= 0, hasta 3 decimales (escala NUMERIC(12,3))"
                observaciones_cierre:
                  type: [string, "null"]
                  maxLength: 2000
      responses:
        "200":
          description: "Seguimiento cerrado vía fn_cerrar_seguimiento (auditoría SEGUIMIENTO_CERRADO por línea y Acta de Consumo ACTA_CONSUMO_GENERADA con snapshot jsonb en la misma transacción)"
        "400":
          description: "Consumo mayor a lo tomado, material ajeno al seguimiento o stock de la unidad insuficiente"
        "404":
          description: "Seguimiento no encontrado"
        "409":
          description: "Seguimiento no se encuentra en estado ABIERTA (doble cierre)"
        "422":
          description: "Falta la línea de consumo de algún material, consumo negativo, duplicado o con más de 3 decimales, o payload inválido (incluye el campo retirado `sobrantes`)"
  /api/v1/inventario/secciones:
    get:
      summary: "Listar secciones de inventario (GENERAL y FO)"
      operationId: "listarSecciones"
      responses:
        "200":
          description: "Lista de secciones de inventario"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeccionOut"
  /api/v1/inventario/secciones/transferibles:
    get:
      summary: "Secciones válidas como origen/destino de transferencias (GENERAL activas + la sección única FO)"
      operationId: "seccionesTransferibles"
      responses:
        "200":
          description: "Lista de secciones transferibles; tipo ∈ {GENERAL, FO}. Las secciones legacy FO_PAQUETE/FO_EN_USO no existen"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeccionTransferibleOut"
  /api/v1/inventario/secciones/{almacen_id}:
    get:
      summary: "Stock de una sección de inventario (stock decimal y valor_unitario)"
      operationId: "stockSeccion"
      responses:
        "200":
          description: "Filas de stock de la sección; stock_actual decimal y valor_unitario por JOIN al catálogo maestro"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeccionStockOut"
        "404":
          description: "Sección no encontrada"
        "422":
          description: "almacen_id inválido"
  /api/v1/inventario/resumen-general:
    get:
      summary: "Valor Total del inventario (Stock Actual × Valor Unitario) en MXN"
      operationId: "resumenGeneral"
      description: "Solo lectura. Suma sobre el Inventario General (secciones GENERAL activas) y el Inventario FO, calculada por PostgreSQL (fn_valor_total_inventario) con aritmética NUMERIC exacta y redondeo a 3 decimales solo al final; el cliente no recalcula. Inventario vacío → 0 (nunca null ni error). Default-deny: exige actor autenticado"
      responses:
        "200":
          description: "Valor total y moneda"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenGeneralOut"
        "403":
          description: "Actor no autenticado o sin autorización (default-deny, AUTHORIZATION_FAILED)"
        "422":
          description: "Cabecera X-Actor ausente o inválida (1..100 caracteres, sin caracteres de control)"
  /api/v1/inventario/sumar-cantidad:
    post:
      summary: "+Cantidad: sumar una cantidad directa al stock existente (Inventario General o Inventario FO)"
      operationId: "sumarCantidad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - destino
                - material_id
                - cantidad
              properties:
                destino:
                  type: string
                  enum: [GENERAL, FO]
                  description: "FO apunta al Inventario FO único por material (sin módulos); enviar `modulo` → 422"
                material_id:
                  type: integer
                  exclusiveMinimum: 0
                cantidad:
                  type: number
                  maximum: 999999999.999
                  description: "Decimal > 0, hasta 3 decimales (escala/rango decimal NUMERIC(12,3), máximo 999999999.999). La regla cantidad > 0 la aplica fn_sumar_cantidad (400); la sobre-precisión o el exceso de rango se rechazan con 422"
                clave_idempotencia:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: "Stock incrementado vía fn_sumar_cantidad (evento inmutable SUMA_CANTIDAD, distinto de AJUSTE_*). stock_nuevo es decimal. Reenvío con la misma clave: resultado original con reenvio_idempotente=true"
          content:
            application/json:
              schema:
                type: object
                required: [destino, material_id, stock_nuevo]
                properties:
                  destino:
                    type: string
                    enum: [GENERAL, FO]
                  material_id:
                    type: integer
                  stock_nuevo:
                    type: number
                  reenvio_idempotente:
                    type: boolean
                    default: false
        "400":
          description: "Cantidad menor o igual a cero, o desbordamiento numérico del stock resultante (SQLSTATE 22003)"
        "403":
          description: "Actor sin alcance sobre las secciones GENERAL activas implicadas (default-deny SEC-002)"
        "404":
          description: "Material inexistente/inactivo o sin registro de inventario previo (requiere carga inicial)"
        "409":
          description: "Más de una sección GENERAL activa con el material (destino no determinable) o clave de idempotencia en uso por otro actor"
        "422":
          description: "Payload inválido (campo no permitido, incluido `modulo`) o cantidad con más de 3 decimales / fuera del rango decimal NUMERIC(12,3)"
  /api/v1/inventario/mover:
    post:
      summary: "Mover: transferencia directa de cantidad parcial entre Inventario General e Inventario FO"
      operationId: "moverMaterial"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - origen
                - destino
                - material_id
                - cantidad
              properties:
                origen:
                  type: string
                  enum: [GENERAL, FO]
                destino:
                  type: string
                  enum: [GENERAL, FO]
                  description: "FO apunta al Inventario FO único por material (sin módulos); enviar `origen_modulo`/`destino_modulo` → 422"
                material_id:
                  type: integer
                  exclusiveMinimum: 0
                cantidad:
                  type: number
                  maximum: 999999999.999
                  description: "Decimal > 0, hasta 3 decimales (escala/rango decimal NUMERIC(12,3), máximo 999999999.999). La regla cantidad > 0 la aplica fn_mover_material (400); la sobre-precisión o el exceso de rango se rechazan con 422"
                clave_idempotencia:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: "Material movido vía fn_mover_material (evento inmutable MOVIMIENTO_INVENTARIO; fila destino creada solo con stock > 0; fila origen en 0 conservada). stock_origen y stock_destino son decimales. Reenvío con la misma clave: resultado original con reenvio_idempotente=true"
          content:
            application/json:
              schema:
                type: object
                required: [material_id, origen, destino, stock_origen, stock_destino]
                properties:
                  material_id:
                    type: integer
                  origen:
                    type: string
                    enum: [GENERAL, FO]
                  destino:
                    type: string
                    enum: [GENERAL, FO]
                  stock_origen:
                    type: number
                  stock_destino:
                    type: number
                  reenvio_idempotente:
                    type: boolean
                    default: false
        "400":
          description: "Cantidad menor o igual a cero, stock insuficiente en el origen (ningún inventario queda modificado) o desbordamiento numérico (SQLSTATE 22003)"
        "403":
          description: "Actor sin alcance sobre las secciones GENERAL activas implicadas (default-deny SEC-002)"
        "404":
          description: "Material inexistente/inactivo o sin registro de inventario en el origen"
        "409":
          description: "Más de una sección GENERAL activa o ninguna activa (destino/origen no determinable) o clave de idempotencia en uso por otro actor"
        "422":
          description: "Destino igual al origen, payload inválido (campo no permitido, incluidos `origen_modulo`/`destino_modulo`) o cantidad con más de 3 decimales / fuera del rango decimal NUMERIC(12,3)"
  /api/v1/reportes/entrega:
    get:
      summary: "Acta(s) de Entrega (hito A: generadas al confirmar TEAMS) en JSON o XLSX sobre la plantilla corporativa"
      operationId: "reporteEntrega"
      parameters:
        - name: equipo_id
          in: query
          required: false
          schema:
            type: integer
        - name: desde
          in: query
          required: false
          schema:
            type: string
        - name: hasta
          in: query
          required: false
          schema:
            type: string
        - name: acta_id
          in: query
          required: false
          schema:
            type: integer
        - name: formato
          in: query
          required: false
          description: "json (listado, por defecto) | normal (plantilla '1 ACTA DE REPORTE NORMAL.xlsx') | extenso (plantilla '2 ACTA DE REPORTE EXTENSO.xlsx'). El CSV legacy queda descartado"
          schema:
            type: string
            enum: [json, normal, extenso]
      responses:
        "200":
          description: "json: listado de actas (snapshot jsonb). normal|extenso: adjunto application/vnd.openxmlformats-officedocument.spreadsheetml.sheet generado inyectando datos con OpenPyXL en la plantilla corporativa (estilo, celdas combinadas y logo conservados). Las cantidades de las líneas (cantidad, cantidad_tomada, cantidad_consumida) son number decimal (hasta 3 decimales)"
        "403":
          description: "equipo_id al que el actor no pertenece"
        "404":
          description: "Formato XLSX solicitado sin actas para los filtros indicados"
        "422":
          description: "Formato no soportado (p. ej. csv)"
  /api/v1/reportes/consumo:
    get:
      summary: "Acta(s) de Consumo (hito B: generadas al cerrar el seguimiento) en JSON o XLSX sobre la plantilla corporativa"
      operationId: "reporteConsumo"
      parameters:
        - name: equipo_id
          in: query
          required: false
          schema:
            type: integer
        - name: desde
          in: query
          required: false
          schema:
            type: string
        - name: hasta
          in: query
          required: false
          schema:
            type: string
        - name: acta_id
          in: query
          required: false
          schema:
            type: integer
        - name: formato
          in: query
          required: false
          description: "json (listado, por defecto) | normal | extenso. En XLSX el título es 'ACTA DE CONSUMO' y CANT. es la cantidad consumida (calculada en SQL); las líneas sin consumo se omiten. El CSV legacy queda descartado"
          schema:
            type: string
            enum: [json, normal, extenso]
      responses:
        "200":
          description: "json: listado de actas (snapshot jsonb). normal|extenso: adjunto XLSX sobre la plantilla corporativa. Las cantidades de las líneas (cantidad_tomada, cantidad_consumida) son number decimal (hasta 3 decimales)"
        "403":
          description: "equipo_id al que el actor no pertenece"
        "404":
          description: "Formato XLSX solicitado sin actas para los filtros indicados"
        "422":
          description: "Formato no soportado (p. ej. csv)"
  /api/v1/auditoria:
    get:
      summary: "Listar eventos del ledger de auditoría (solo lectura)"
      operationId: "listarAuditoria"
      parameters:
        - name: material_id
          in: query
          required: false
          schema:
            type: integer
        - name: tipo_accion
          in: query
          required: false
          schema:
            type: string
        - name: usuario
          in: query
          required: false
          schema:
            type: string
        - name: descripcion
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: "Eventos inmutables append-only (no se editan ni borran vía API); `cantidad` es number decimal (hasta 3 decimales) o null"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditoriaListOut"
        "422":
          description: "Parámetros de consulta inválidos"
  /api/v1/fibra:
    get:
      summary: "Listar el Inventario FO unificado (una fila por material, con valor_unitario)"
      operationId: "stockFibra"
      responses:
        "200":
          description: "Filas físicas de inventario_fibra de materiales activos (cero fantasmas); stock_actual decimal y valor_unitario por JOIN al catálogo maestro. Reemplaza a GET /fibra/{modulo}"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FibraStockOut"
        "422":
          description: "Cabecera X-Actor ausente o inválida (1..100 caracteres, sin caracteres de control)"
  /api/v1/fibra/carga-inicial:
    post:
      summary: "Carga inicial del Inventario FO (alta única por material)"
      operationId: "cargaInicialFibra"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FibraCargaInicialRequest"
      responses:
        "200":
          description: "Fila de Inventario FO creada vía fn_cargar_stock_inicial_fibra (evento STOCK_INICIAL_FO)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FibraOperacionOut"
        "400":
          description: "Material con fila FO ya existente, cantidad negativa o desbordamiento numérico (SQLSTATE 22003)"
        "422":
          description: "Payload inválido: campo no permitido (extra forbid, incluido `modulo`), cantidad con más de 3 decimales o fuera del rango NUMERIC(12,3)"
  /api/v1/fibra/ajuste:
    post:
      summary: "Ajuste administrativo de existencias del Inventario FO"
      operationId: "ajusteFibra"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FibraAjusteRequest"
      responses:
        "200":
          description: "Stock FO ajustado vía fn_ajustar_stock_fibra (evento AJUSTE_INVENTARIO_FO)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FibraOperacionOut"
        "400":
          description: "Stock final negativo o desbordamiento numérico (SQLSTATE 22003)"
        "404":
          description: "Sin fila en el Inventario FO (requiere carga inicial)"
        "422":
          description: "Payload inválido: campo no permitido (extra forbid, incluido `modulo`), nuevo_stock con más de 3 decimales o fuera del rango NUMERIC(12,3)"
  /api/v1/fibra/materiales/{material_id}:
    patch:
      summary: "Modificar material del Inventario FO (catálogo + stock ajustado y auditado); valor_unitario solo administrador"
      operationId: "actualizarMaterialFibra"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FibraMaterialUpdateRequest"
      responses:
        "200":
          description: "Material FO actualizado: edición de catálogo auditada (trigger) y, si se envía stock_actual, ajuste AJUSTE_INVENTARIO_FO vía fn_ajustar_stock_fibra en una única transacción atómica. `valor_unitario: null` explícito es un no-op"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FibraMaterialOut"
        "403":
          description: "La presencia de `valor_unitario` en el payload exige rol administrador (AUTHORIZATION_FAILED); se evalúa antes de construir el payload de catálogo"
        "404":
          description: "Material no encontrado (catálogo inexistente/inactivo) o sin fila en el Inventario FO"
        "422":
          description: "Campo no permitido (extra forbid, incluido `modulo`), U.M. inexistente en el maestro ums, selector dual de categoría inválido, o valor_unitario/stock_actual negativo, con más de 3 decimales o fuera del rango NUMERIC(12,3)"
    delete:
      summary: "Eliminar la fila del material en el Inventario FO (auditada ELIMINACION_FO)"
      operationId: "eliminarMaterialFibra"
      parameters:
        - name: motivo
          in: query
          required: false
          description: "Obligatorio y no vacío solo si la fila tiene stock_actual > 0 (REQ-DEL-004); con stock 0 es opcional"
          schema:
            type: string
      responses:
        "204":
          description: "Fila de Inventario FO eliminada vía fn_eliminar_inventario_fibra (evento ELIMINACION_FO con snapshot completo jsonb); el catálogo y el Inventario General permanecen intactos"
        "404":
          description: "Material inexistente/inactivo en el catálogo o sin fila en el Inventario FO"
        "409":
          description: "Error de integridad al confirmar la eliminación (restricción diferida), traducido a error controlado de dominio"
        "422":
          description: "Motivo vacío con stock_actual > 0 (REQ-DEL-004)"

components:
  schemas:
    MaterialOut:
      type: object
      required: [id_lista, codigo, descripcion, categoria_id, categoria, u_m, stock_minimo, valor_unitario, is_active]
      properties:
        id_lista:
          type: integer
        codigo:
          type: [string, "null"]
        descripcion:
          type: string
        categoria_id:
          type: [integer, "null"]
        categoria:
          type: [string, "null"]
        u_m:
          type: [string, "null"]
        stock_minimo:
          type: [integer, "null"]
        valor_unitario:
          type: number
          minimum: 0
          description: "Valor Unitario en MXN, decimal >= 0, hasta 3 decimales (escala NUMERIC(12,3), máximo 999999999.999)"
        is_active:
          type: boolean
    MaterialListOut:
      type: object
      required: [materiales]
      properties:
        start_index:
          type: integer
          default: 1
        materiales:
          type: array
          items:
            $ref: "#/components/schemas/MaterialOut"
    MaterialCreate:
      type: object
      additionalProperties: false
      required: [descripcion]
      description: "Sin valor_unitario: el alta lo fija en 1.000 MXN (extra forbid → 422 si se envía)"
      properties:
        descripcion:
          type: string
          minLength: 1
          maxLength: 255
        codigo:
          type: [string, "null"]
          maxLength: 50
        categoria_id:
          type: [integer, "null"]
        nueva_categoria:
          type: [string, "null"]
          maxLength: 100
        u_m:
          type: [string, "null"]
        stock_minimo:
          type: [integer, "null"]
          minimum: 0
        stock_inicial:
          type: [number, "null"]
          minimum: 0
          maximum: 999999999.999
          description: "Decimal >= 0, hasta 3 decimales (escala NUMERIC(12,3), máximo 999999999.999)"
        seccion_id:
          type: [integer, "null"]
    MaterialUpdate:
      type: object
      additionalProperties: false
      properties:
        descripcion:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
        codigo:
          type: [string, "null"]
          maxLength: 50
        categoria_id:
          type: [integer, "null"]
        nueva_categoria:
          type: [string, "null"]
          maxLength: 100
        u_m:
          type: [string, "null"]
        stock_minimo:
          type: [integer, "null"]
          minimum: 0
        stock_actual:
          type: [number, "null"]
          minimum: 0
          maximum: 999999999.999
          description: "Decimal >= 0, hasta 3 decimales (escala NUMERIC(12,3), máximo 999999999.999); se enruta a fn_ajustar_stock_general (nunca por ORM)"
        valor_unitario:
          type: [number, "null"]
          minimum: 0
          maximum: 999999999.999
          description: "Decimal >= 0, hasta 3 decimales (escala NUMERIC(12,3), máximo 999999999.999). Solo administrador: su presencia en el payload con otro rol → 403. null explícito = no-op (sin escritura ni auditoría)"
        motivo:
          type: [string, "null"]
          maxLength: 500
        is_active:
          type: [boolean, "null"]
    SeccionOut:
      type: object
      description: "Sección del maestro (`tipo`: `GENERAL` o `FO`)."
      required: [almacen_id, nombre, tipo, is_active]
      properties:
        almacen_id:
          type: integer
        nombre:
          type: string
        tipo:
          type: string
        is_active:
          type: boolean
    SeccionTransferibleOut:
      type: object
      required: [almacen_id, nombre, tipo]
      properties:
        almacen_id:
          type: integer
        nombre:
          type: string
        tipo:
          type: string
          enum: [GENERAL, FO]
          description: "tipo de sección: solo GENERAL o FO"
        transferible:
          type: boolean
          default: true
    SeccionStockOut:
      type: object
      required: [material_id, codigo, descripcion, u_m, stock_minimo, stock_actual, valor_unitario, alerta_stock]
      properties:
        material_id:
          type: integer
        codigo:
          type: [string, "null"]
        descripcion:
          type: string
        u_m:
          type: [string, "null"]
        stock_minimo:
          type: [integer, "null"]
        stock_actual:
          type: number
          description: "Decimal, hasta 3 decimales (escala NUMERIC(12,3), máximo 999999999.999)"
        valor_unitario:
          type: number
          description: "MXN, decimal >= 0, hasta 3 decimales (escala NUMERIC(12,3), máximo 999999999.999)"
        alerta_stock:
          type: boolean
    InventarioEquipoOut:
      type: object
      required: [equipo_id, material_id, codigo, descripcion, u_m, stock_minimo, stock_actual, valor_unitario, alerta_stock, ultimo_movimiento_id]
      properties:
        equipo_id:
          type: integer
        material_id:
          type: integer
        codigo:
